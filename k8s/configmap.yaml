# Kubernetes ConfigMap
# Environment-agnostic configuration

apiVersion: v1
kind: ConfigMap
metadata:
  name: nextjs-config
  namespace: plataformas-web
data:
  # Next.js public config (exposed to browser)
  NEXT_PUBLIC_API_URL: "http://fastify-api:4000"
  NEXT_PUBLIC_APP_NAME: "Mi Primera Plataforma"
  NODE_ENV: "production"
  # Logging
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: plataformas-web
data:
  NODE_ENV: "production"
  PORT: "4000"
  # CORS
  CORS_ORIGIN: "*"
  # Rate limiting
  RATE_LIMIT_MAX: "100"
  RATE_LIMIT_WINDOW_MS: "60000"
  # Meilisearch (local to the namespace)
  MEILISEARCH_HOST: "http://meilisearch:7700"
  # Logging
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  # Health check path
  HEALTH_PATH: "/health"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: plataformas-web
data:
  # Points to the shared postgres in viko-apps
  POSTGRES_HOST: "postgres.viko-apps.svc"
  POSTGRES_DB: "mi_primera_plataforma"
  POSTGRES_USER: "mi_primera_plataforma"
  # Connection pool settings
  POSTGRES_MAX_CONNECTIONS: "20"
  POSTGRES_IDLE_TIMEOUT_MS: "30000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: plataformas-web
data:
  # Points to shared redis in viko-apps, using DB 1
  REDIS_HOST: "redis.viko-apps.svc"
  REDIS_DB: "1"
  REDIS_PREFIX: "mi-primera-plataforma"
  # TTL defaults
  REDIS_CACHE_TTL: "3600"
  REDIS_SESSION_TTL: "86400"